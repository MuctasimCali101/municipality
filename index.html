<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUNICIPALITY — Nidaamka Diwaangelinta Dhulka</title>
  <meta name="description" content="Municipality Field Registration System - Bosaso, Somalia">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a1628">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Critical inline CSS fallback if external CSS fails to load -->
  <style>
    body { background: #0a1628; color: #fff; font-family: sans-serif; margin: 0; }
    .login-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #0a1628, #0d1f3c, #0a1628); }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .logo-icon { width: 64px; height: 64px; background: #00c896; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 1.8rem; font-weight: 800; color: #0a1628; }
    .login-logo h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
    .login-logo p { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
    .login-card { width: 100%; max-width: 400px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 32px 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
    .form-group input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; font-size: 0.95rem; box-sizing: border-box; min-height: 44px; }
    .form-group input:focus { outline: none; border-color: #00c896; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; min-height: 44px; text-decoration: none; font-family: inherit; }
    .btn-primary { background: #00c896; color: #0a1628 !important; width: 100%; }
    .btn-primary:hover { background: #00b086; }
    .btn-ghost { background: transparent; color: rgba(255,255,255,0.7) !important; }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); }
    .btn-sm { padding: 8px 16px; font-size: 0.8rem; min-height: 36px; }
    .text-center { text-align: center; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 0.75rem; color: rgba(255,255,255,0.5); }
    .lang-switcher { position: absolute; top: 16px; right: 16px; z-index: 2; display: flex; gap: 4px; }
    .lang-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
    .lang-btn.active { background: rgba(0,200,150,0.15); border-color: #00c896; color: #00c896; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #0a1628; border: 1px solid rgba(0,200,150,0.2); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 480px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.5rem; cursor: pointer; }
    .modal h2 { margin-bottom: 20px; font-size: 1.5rem; }
  </style>
</head>
<body class="no-bottom-nav">
  <div class="login-page">
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="so" onclick="switchLang('so')">Soomaali</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
    </div>

    <div class="login-logo">
      <div class="logo-icon">M</div>
      <h1>MUNICIPALITY</h1>
      <p id="loginSubtitle">Nidaamka Diwaangelinta Dhulka</p>
    </div>

    <div class="login-card">
      <div class="card">
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="username" id="lblUsername">Magaca isticmaale</label>
            <input type="text" id="username" placeholder="Magaca isticmaale" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password" id="lblPassword">Furaha sirta ah</label>
            <input type="password" id="password" placeholder="Furaha sirta ah" required autocomplete="current-password">
          </div>

          <div class="form-group">
            <label for="cityCode" id="lblCityCode">Koodhka Magaalada</label>
            <input type="text" id="cityCode" placeholder="e.g. BOS" required autocomplete="off" value="">
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Gal</button>
        </form>

        <div style="text-align:center;margin-top:16px;">
          <button class="btn btn-ghost btn-sm" onclick="showAdminModal()" id="btnAdminLogin">Admin Galid</button>
        </div>
      </div>

      <p class="login-footer" id="loginFooter">
        &copy; 2026 MUNICIPALITY &middot; Bosaso, Somalia
      </p>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal" style="position:relative;">
      <button class="modal-close" onclick="closeAdminModal()">&times;</button>
      <h2 id="adminModalTitle">Admin Galid</h2>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminPassword" id="lblAdminPassword">Furaha Admin-ka</label>
          <input type="password" id="adminPassword" placeholder="Furaha sirta ah" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnAdminLoginSubmit">Gal</button>
      </form>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    // Restore saved city code
    document.addEventListener('DOMContentLoaded', () => {
      const savedCode = AUTH.getStoredCityCode();
      if (savedCode) document.getElementById('cityCode').value = savedCode;
    });

    // Language switching
    function switchLang(lang) {
      AUTH.setLang(lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang;

      const t = (key) => APP.t(key);

      document.getElementById('loginSubtitle').textContent = lang === 'en'
        ? 'Field Registration System'
        : 'Nidaamka Diwaangelinta Dhulka';
      document.getElementById('lblUsername').textContent = t('username');
      document.getElementById('lblPassword').textContent = t('password');
      document.getElementById('lblCityCode').textContent = t('city_code');
      document.getElementById('btnLogin').textContent = t('sign_in');
      document.getElementById('btnAdminLogin').textContent = t('admin_login');
      document.getElementById('adminModalTitle').textContent = lang === 'en' ? 'Admin Login' : 'Admin Galid';
      document.getElementById('lblAdminPassword').textContent = t('admin_password');
      document.getElementById('btnAdminLoginSubmit').textContent = t('sign_in');
      document.getElementById('loginFooter').innerHTML = '&copy; 2026 MUNICIPALITY &middot; Bosaso, Somalia';

      document.getElementById('username').placeholder = t('username');
      document.getElementById('password').placeholder = t('password');
      document.getElementById('cityCode').placeholder = lang === 'en' ? 'e.g. BOS' : 'e.g. BOS';
    }

    // Admin modal
    function showAdminModal() {
      document.getElementById('adminModal').classList.add('open');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('open');
    }

    // Close modal on overlay click
    document.getElementById('adminModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeAdminModal();
    });

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const cityCode = document.getElementById('cityCode').value.trim().toUpperCase();

      if (!username || !password || !cityCode) {
        APP.showToast(APP.t('required'), 'error');
        return;
      }

      APP.showLoading(APP.t('loading'));

      try {
        const user = await AUTH.login(username, password, cityCode);
        APP.hideLoading();
        APP.showToast(APP.t('success'), 'success');
        window.location.href = 'dashboard.html';
      } catch (err) {
        APP.hideLoading();
        APP.showToast(err.message || APP.t('login_error'), 'error');
      }
    });

    // Admin login form handler
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('adminPassword').value.trim();

      if (!password) {
        APP.showToast(APP.t('required'), 'error');
        return;
      }

      APP.showLoading(APP.t('loading'));

      try {
        const user = await AUTH.adminLogin(password);
        APP.hideLoading();
        closeAdminModal();
        APP.showToast(APP.t('success'), 'success');
        window.location.href = 'admin.html';
      } catch (err) {
        APP.hideLoading();
        APP.showToast(err.message || APP.t('login_error'), 'error');
      }
    });

    // Initialize with saved language
    const savedLang = AUTH.getLang();
    switchLang(savedLang);
  </script>
</body>
</html>
